<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書籍要約</title>
  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header>
    <div class="header-row">
      <h1>📚 書籍要約</h1>
      <span class="header-count" id="header-count"></span>
    </div>
  </header>

  <div class="container">
    <div class="mode-tabs">
      <button class="tab-btn active" id="tab-random" onclick="switchMode('random')">ランダム</button>
      <button class="tab-btn" id="tab-list" onclick="switchMode('list')">一覧</button>
      <button class="tab-btn" id="tab-quiz" onclick="switchMode('quiz')">クイズ</button>
    </div>

    <div class="category-tabs">
      <button class="cat-btn active" data-cat="all" onclick="selectCategory('all')">すべて</button>
      <button class="cat-btn" data-cat="経営" onclick="selectCategory('経営')">経営</button>
      <button class="cat-btn" data-cat="経済" onclick="selectCategory('経済')">経済</button>
      <button class="cat-btn" data-cat="IT" onclick="selectCategory('IT')">IT</button>
      <button class="cat-btn" data-cat="教養" onclick="selectCategory('教養')">教養</button>
    </div>

    <!-- ランダムモード -->
    <div id="mode-random">
      <div class="card" id="book-card">
        <div class="card-header">
          <span class="category" id="book-category"></span>
          <div class="card-meta">
            <span class="book-number" id="book-number"></span>
            <span class="year" id="book-year"></span>
          </div>
        </div>
        <h2 class="book-title" id="book-title"></h2>
        <p class="book-author" id="book-author"></p>
        <div class="divider"></div>
        <h3 class="section-label">概要</h3>
        <p class="summary" id="book-summary"></p>
        <h3 class="section-label">主なポイント</h3>
        <ul class="points" id="book-points"></ul>
        <h3 class="section-label">この本から学べること</h3>
        <p class="takeaway" id="book-takeaway"></p>
      </div>
    </div>

    <!-- 一覧モード -->
    <div id="mode-list" style="display:none">
      <div id="book-list"></div>
    </div>

    <!-- クイズモード -->
    <div id="mode-quiz" style="display:none">
      <div class="card">
        <p class="quiz-question" id="quiz-question"></p>
        <button class="btn btn-primary" id="quiz-reveal" onclick="revealAnswer()">解答を見る</button>
      </div>
    </div>
  </div>

  <div class="fixed-footer" id="fixed-footer">
    <div id="footer-random" class="random-row">
      <button class="btn btn-nav" id="btn-prev" onclick="goPrev()" disabled>◀ 前へ</button>
      <button class="btn btn-primary" onclick="showRandom()">ランダム表示</button>
      <button class="btn btn-nav" id="btn-next" onclick="goNext()" disabled>次へ ▶</button>
    </div>
    <div id="footer-quiz" class="random-row" style="display:none">
      <button class="btn btn-nav" id="quiz-btn-prev" onclick="quizGoPrev()" disabled>戻る</button>
      <button class="btn btn-primary" onclick="nextQuestion()">次の問題</button>
      <button class="btn btn-nav" id="quiz-btn-next" onclick="quizGoNext()" disabled>進む</button>
    </div>
    <p class="counter" id="counter"></p>
  </div>

  <script src="books.js?v=4"></script>
  <script src="app.js?v=7"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/02_BookSummary/sw.js').then(reg => {
        // 新しいSWがactivateしたらページをリロードしてコードを最新化
        // localStorage/IndexedDBのユーザーデータはリロードで消えない
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
